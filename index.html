<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Little Story ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HALAMAN AWAL
    ========================== -->

    <section id="halamanAwal" class="halaman aktif">

        <div class="card">

            <div class="cat">🐱</div>

            <h1>Our Little Story ♡</h1>

            <p class="subtitle">
                Sebelum masuk, isi dulu yaa...
            </p>

            <input
                type="text"
                id="nama"
                placeholder="Nama kamu"
                autocomplete="off"
            >

            <input
                type="text"
                id="tanggal"
                placeholder="26 Desember 2024"
                autocomplete="off"
            >

            <button onclick="cekTanggal()">
                LANJUT ♡
            </button>

            <p id="pesanTanggal" class="pesan"></p>

        </div>

    </section>


    <!-- =========================
         HALAMAN PERTANYAAN
    ========================== -->

    <section id="halamanPertanyaan" class="halaman">

        <div class="card">

            <div class="cat">🐱</div>

            <h1>Little Questions ♡</h1>

            <p id="nomorPertanyaan">
                1 / 7
            </p>

            <h2 id="pertanyaan"></h2>

            <!-- Jawaban pertanyaan 1-6 -->
            <input
                type="text"
                id="jawaban"
                placeholder="Tulis jawaban kamu..."
                autocomplete="off"
            >

            <!-- Khusus pertanyaan terakhir -->
            <textarea
                id="saran"
                placeholder="Ceritakan moment paling bahagia kamu sama saya..."
                rows="5"
                style="display: none;"
            ></textarea>

            <button onclick="cekJawaban()">
                NEXT ♡
            </button>

            <p id="pesanJawaban" class="pesan"></p>

        </div>

    </section>


    <!-- =========================
         HALAMAN PHOTOBOOTH
    ========================== -->

    <section id="halamanPhotobooth" class="halaman">

        <div class="photo-card">

            <h1>♡ Our Photobooth ♡</h1>

            <p id="info">
                26 Desember 2024 ♡
            </p>

            <div class="camera-box">

                <video
                    id="video"
                    autoplay
                    playsinline
                ></video>

                <div id="countdown"></div>

            </div>

            <button
                id="btnFoto"
                onclick="ambilFoto()"
            >
                📸 AMBIL FOTO
            </button>

            <p id="statusFoto">
                Foto 1 dari 3 ♡
            </p>

        </div>

        <!-- Canvas disembunyikan -->
        <canvas id="canvas" style="display: none;"></canvas>

    </section>


    <!-- =========================
         HALAMAN HASIL
    ========================== -->

    <section id="halamanHasil" class="halaman">

        <div class="result-card">

            <h1>Our Little Moment ♡</h1>

            <p id="download-info">
                Foto sudah jadi! ♡
            </p>

            <div id="hasilFoto"></div>

            <button onclick="simpanFoto()">
                💾 DOWNLOAD PHOTO
            </button>

            <button
                class="secondary"
                onclick="ulangFoto()"
            >
                🔄 AMBIL ULANG
            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
